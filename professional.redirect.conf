server {
  listen 80;
  server_name professional.healthopt.tech;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name professional.healthopt.tech;

  ssl_certificate /etc/letsencrypt/live/professional.healthopt.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/professional.healthopt.tech/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Redirect root URL to the professional login path so client-side routing picks the Professional UI
  location = / {
    return 302 /professional-login;
  }

  location /professional-login {
    proxy_pass http://127.0.0.1:3001/professional-login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  # Serve assets and APIs from backend root
  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}
